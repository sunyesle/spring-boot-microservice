server:
  port: 9000
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/spring-microservice-security-realm
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: false
          routes:
            - id: product_service
              uri: ${product.url}
              predicates:
                - Path=/api/products/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productServiceCircuitBreaker
                    fallbackUri: forward:/fallbackRoute

            - id: order_service
              uri: ${order.url}
              predicates:
                - Path=/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderServiceCircuitBreaker
                    fallbackUri: forward:/fallbackRoute

            - id: inventory_service
              uri: ${inventory.url}
              predicates:
                - Path=/api/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventoryServiceCircuitBreaker
                    fallbackUri: forward:/fallbackRoute

            - id: product_service_swagger
              uri: ${product.url}
              predicates:
                - Path=/aggregate/product-service/v3/api-docs/**
              filters:
                - SetPath=/api-docs
                - name: CircuitBreaker
                  args:
                    name: productServiceSwaggerCircuitBreaker
                    fallbackUri: forward:/fallbackRoute

            - id: order_service_swagger
              uri: ${order.url}
              predicates:
                - Path=/aggregate/order-service/v3/api-docs/**
              filters:
                - SetPath=/api-docs
                - name: CircuitBreaker
                  args:
                    name: orderServiceSwaggerCircuitBreaker
                    fallbackUri: forward:/fallbackRoute

            - id: inventory_service_swagger
              uri: ${inventory.url}
              predicates:
                - Path=/aggregate/inventory-service/v3/api-docs/**
              filters:
                - SetPath=/api-docs
                - name: CircuitBreaker
                  args:
                    name: inventoryServiceSwaggerCircuitBreaker
                    fallbackUri: forward:/fallbackRoute
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        minimum-number-of-calls: 5
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  observations:
    key-values:
      application: api-gateway
  tracing:
    sampling:
      probability: 1.0
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Product Service
        url: /aggregate/product-service/v3/api-docs
      - name: Order Service
        url: /aggregate/order-service/v3/api-docs
      - name: Inventory Service
        url: /aggregate/inventory-service/v3/api-docs
  api-docs:
    path: /api-docs
product:
  url: http://localhost:8080
order:
  url: http://localhost:8081
inventory:
  url: http://localhost:8082
loki:
  url: http://localhost:3100/loki/api/v1/push
